name: Firestore rules tests

# Runs firebase/rules-test in the Firestore emulator (a local test database, no real data).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firebase/**']

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test tools
        working-directory: firebase/rules-test
        run: npm install --no-audit --no-fund
      - name: Run the rules tests in the emulator
        working-directory: firebase/rules-test
        run: npx firebase emulators:exec --only firestore --project demo-familyhub "node --test"
