name: Build APK


on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      - name: Restore Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          cp ~/.android/debug.keystore "$RUNNER_TEMP/debug-ci.keystore"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug-ci.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore ~/.android/debug.keystore -storepass android


      - name: Build Debug APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FH_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace


      - name: Verify signing key and Web client ID
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          EXPECTED_SHA1="a07fc102a4b6c6258b7336cf5365ff4bdb82140d"
          EXPECTED_WEB="1070062203046-pfg9qe1rj4nd3u35od3vvqbb3f7cp3lp.apps.googleusercontent.com"
          APK_SHA1=$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "SHA-1" | head -1 | awk '{print $NF}')
          echo "APK signed with SHA-1: $APK_SHA1"
          echo "Firebase has SHA-1:    $EXPECTED_SHA1"
          [ "$APK_SHA1" = "$EXPECTED_SHA1" ] && echo "SHA-1 MATCH" || echo "SHA-1 MISMATCH -> register the APK SHA-1 in Firebase"
          [ "$(echo -n "$GOOGLE_WEB_CLIENT_ID" | tr -d '[:space:]')" = "$EXPECTED_WEB" ] && echo "WEB CLIENT ID MATCH" || echo "WEB CLIENT ID MISMATCH or EMPTY -> fix the GOOGLE_WEB_CLIENT_ID secret"

      # Play Protect blocks downloaded APKs that declare these (see docs/PLAY_PROTECT_INVESTIGATION.md).
      # Fails the build if the final, merged APK manifest has any of them; prints the full list and the signature.
      - name: Permission and signature audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          BT=$ANDROID_HOME/build-tools/35.0.0
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "== Permissions in the built APK (merged manifest):"
          $BT/aapt2 dump permissions "$APK" | tee perms.txt
          echo "== Exported components and services needing review:"
          $BT/aapt2 dump xmltree --file AndroidManifest.xml "$APK" | grep -E "BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE" || echo "none"
          bad=$(grep -oE "android.permission.(READ_SMS|RECEIVE_SMS|RECEIVE_MMS|RECEIVE_WAP_PUSH|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE)" perms.txt | sort -u || true)
          bad2=$($BT/aapt2 dump xmltree --file AndroidManifest.xml "$APK" | grep -oE "BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE" | sort -u || true)
          if [ -n "$bad$bad2" ]; then echo "CHECK sensitive permissions: FAIL ($bad $bad2)"; exit 1; else echo "CHECK no SMS-reading, notification-listener or accessibility permission: PASS"; fi
          echo "== APK"
          sha256sum "$APK"
          $BT/aapt2 dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion"
          $BT/apksigner verify --print-certs "$APK" | grep -E "SHA-256|SHA-1|DN" | tee cert-new.txt
          echo "== Same signer as the published FamilyHub 2.1.116 (so it updates without uninstalling)?"
          if gh release download build-116 --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir old 2>/dev/null; then
            $BT/apksigner verify --print-certs old/*.apk | grep -E "SHA-256" | tee cert-old.txt
            [ "$(grep -m1 SHA-256 cert-new.txt | awk '{print $NF}')" = "$(grep -m1 SHA-256 cert-old.txt | awk '{print $NF}')" ] \
              && echo "CHECK same signing certificate as 2.1.116: PASS" || { echo "CHECK same signing certificate as 2.1.116: FAIL"; exit 1; }
          else echo "Could not download build-116 to compare (skipped)"; fi


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-hub-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Installs the new APK on an Android emulator, opens it, taps "Continue with Google"
  # and fails if the app crashes. The log shows what was on screen.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: family-hub-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick >/dev/null 2>&1 || true

      - name: Write test script
        run: |
          mkdir -p shots
          cat > smoke.sh <<'SCRIPT'
          #!/bin/bash
          PKG=com.familyhub.app
          screen_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            adb pull /sdcard/ui.xml "shots/$1.xml" >/dev/null 2>&1
            echo "---- On screen ($1):"
            grep -o 'text="[^"]\+"' "shots/$1.xml" | sort -u | head -40
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png "shots/$1.png" >/dev/null 2>&1
          }
          shot() {
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png "shots/$1-full.png" >/dev/null 2>&1
            convert "shots/$1-full.png" -resize 432x -quality 70 "shots/$1.jpg" 2>/dev/null && echo "SHOT_$1:$(base64 -w0 "shots/$1.jpg")"
          }
          adb install -r apk/app-debug.apk
          adb logcat -c
          adb shell am start -W -n $PKG/.MainActivity
          sleep 1
          shot intro
          sleep 6
          shot login
          sleep 12
          screen_text 1-launch
          B=$(grep -o 'text="Continue with Google"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' shots/1-launch.xml | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
          if [ -n "$B" ]; then
            set -- $(echo "$B" | sed 's/\]\[/ /; s/[][]//g; s/,/ /g')
            adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
            sleep 15
            screen_text 2-after-tap
            shot after_tap
          else
            echo "Continue with Google button not found on screen"
          fi
          # Open every newer screen with sample data, photograph it and note any crash.
          read SW SH <<< "$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | tail -1 | tr x ' ')"
          demo() {
            name=$(echo "$1" | tr ':' '_')
            echo "DEMO_SCREEN: $1"
            before=$(adb logcat -d | grep -c "FATAL EXCEPTION")
            if [ -n "$2" ]; then
              adb shell am start -W -n $PKG/.DemoActivity --es route "$1" --es ask "$2" >/dev/null 2>&1
            else
              adb shell am start -W -n $PKG/.DemoActivity --es route "$1" >/dev/null 2>&1
            fi
            sleep "$3"
            shot "demo_$name"
            if [ "$4" = "scroll" ]; then
              for n in 2 3; do
                adb shell input swipe $((SW / 2)) $((SH * 8 / 10)) $((SW / 2)) $((SH * 2 / 10)) 500
                sleep 2
                shot "demo_${name}_$n"
              done
            fi
            if [ "$4" = "up" ]; then
              for n in 2 3 4 5; do
                adb shell input swipe $((SW / 2)) $((SH * 3 / 10)) $((SW / 2)) $((SH * 8 / 10)) 500
                sleep 2
                shot "demo_${name}_$n"
              done
            fi
            after=$(adb logcat -d | grep -c "FATAL EXCEPTION")
            [ "$after" != "$before" ] && echo "DEMO_CRASH: $1"
            adb shell am force-stop $PKG
          }
          # Each screenshot is named after the real screen. "dark:" opens it in the dark theme.
          for r in more settings family_tab safety sos categories duplicates chat_list calls universal ai_settings reminders health_hub alerts; do demo "$r" "" 6 no; done
          for r in home finance transactions insights cards import; do demo "$r" "" 6 scroll; done
          for r in dark:home dark:finance dark:transactions; do demo "$r" "" 6 scroll; done
          for r in dark:more dark:settings dark:categories dark:duplicates dark:safety dark:health_hub solid:home; do demo "$r" "" 6 no; done
          for r in form_expense form_edit_expense sheet_transaction dark:form_expense dark:sheet_transaction; do demo "$r" "" 7 no; done
          for r in home_scrolled dark:home_scrolled; do demo "$r" "" 8 no; done
          demo assistant "Find_duplicate_transactions" 60 up

          # ---- The assistant changes a Finance category: a real save in a local test database (Firestore emulator
          # on this computer, reached from the phone emulator at 10.0.2.2), read back from it, then Undo. ----
          tap_text() {
            for try in 1 2 3; do
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml "shots/tap-$2-$try.xml" >/dev/null 2>&1
              B=$(grep -o "text=\"$1\"[^>]*bounds=\"\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]\"" "shots/tap-$2-$try.xml" | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
              if [ -n "$B" ]; then
                set -- "$1" "$2" $(echo "$B" | sed 's/\]\[/ /; s/[][]//g; s/,/ /g')
                adb shell input tap $(( ($3 + $5) / 2 )) $(( ($4 + $6) / 2 ))
                echo "TAPPED: $1"
                return 0
              fi
              # Not in view: scroll the chat back a little and look again.
              adb shell input swipe $((SW / 2)) $((SH * 3 / 10)) $((SW / 2)) $((SH * 5 / 10)) 400
              sleep 2
            done
            echo "NOT FOUND ON SCREEN: $1"
            return 1
          }
          seen() { if grep -q "$1" "shots/$2.xml"; then r=PASS; else r=FAIL; fi; echo "CHECK $3: $r"; echo "CHECK $3: $r" >> shots/checks.txt; }
          notseen() { if [ -s "shots/$2.xml" ] && ! grep -q "$1" "shots/$2.xml"; then r=PASS; else r=FAIL; fi; echo "CHECK $3: $r"; echo "CHECK $3: $r" >> shots/checks.txt; }
          ASK="Change_the_category_of_Swiggy_order_from_Meghana_Foods_to_Shopping"
          recat() { adb shell am start -W -n $PKG/.DemoActivity --es route ai_recat --es store "$1" --es ask "$2" >/dev/null 2>&1; sleep "$3"; }
          echo "==== AI category change (test database) ===="
          recat emulator "$ASK" 30
          shot demo_ai_recat_1_confirm; screen_text ai_recat_1
          seen 'Category: Dining → Shopping' ai_recat_1 "confirmation card shows the real entry and the new category"
          seen 'text="Change"' ai_recat_1 "nothing changed before confirming (Change button waiting)"
          tap_text Change c1; sleep 15
          shot demo_ai_recat_2_changed; screen_text ai_recat_2
          seen 'Done: ' ai_recat_2 "result shown only after the save (Done message)"
          seen 'The server confirmed it' ai_recat_2 "result read back from the database"
          seen 'Shopping • UPI' ai_recat_2 "Finance row shows Shopping"
          tap_text Undo u1; sleep 15
          shot demo_ai_recat_3_undone; screen_text ai_recat_3
          seen 'is back in Dining' ai_recat_3 "Undo confirmed by the database"
          seen 'Dining • UPI' ai_recat_3 "Finance row back to Dining"
          adb shell am force-stop $PKG
          # Change it again, then open the real Finance detail sheet in a new process (data from the test database).
          recat emulator "$ASK" 30; tap_text Change c2; sleep 15; adb shell am force-stop $PKG
          adb shell am start -W -n $PKG/.DemoActivity --es route sheet_transaction --es store emulator >/dev/null 2>&1; sleep 15
          shot demo_ai_recat_4_finance_details; screen_text ai_recat_4
          seen 'Shopping' ai_recat_4 "Finance details show the new category after a restart"
          adb shell am force-stop $PKG
          # Several matches: every one is listed and the person picks one.
          recat emulator "change_category_of_swiggy_to_shopping" 25
          shot demo_ai_recat_5_choose; screen_text ai_recat_5
          seen 'Which one do you mean' ai_recat_5 "several matches: the question is shown first"
          # The long question can push the first card's Change button below the visible part: scroll the conversation a little.
          if ! grep -q 'text="Change"' shots/ai_recat_5.xml; then
            adb shell input swipe $((SW / 2)) $((SH * 55 / 100)) $((SW / 2)) $((SH * 30 / 100)) 500; sleep 2; screen_text ai_recat_5b
            cp shots/ai_recat_5b.xml shots/ai_recat_5.xml
          fi
          grep -q 'text="Change"' shots/ai_recat_5.xml && echo "CHECK several matches: a card to pick is on screen: PASS" || echo "CHECK several matches: a card to pick is on screen: FAIL"
          adb shell am force-stop $PKG
          # Database unreachable: the card must not say Changed.
          recat offline "$ASK" 25; tap_text Change c3; sleep 30
          shot demo_ai_recat_6_offline; screen_text ai_recat_6
          seen 'Not confirmed' ai_recat_6 "no success claimed without the database"
          grep -q 'Changed ✓' shots/ai_recat_6.xml && echo "CHECK offline never says Changed: FAIL" || echo "CHECK offline never says Changed: PASS"
          adb shell am force-stop $PKG
          adb logcat -d | grep -E "DemoStore|DemoActivity" | tail -10
          # The brief's own sentence: a UPI payment to a person.
          recat emulator "Change_the_category_of_Mukul_to_Shopping." 30
          shot demo_ai_recat_7_mukul; screen_text ai_recat_7
          seen 'Category: Other → Shopping' ai_recat_7 "Mukul: the payment to Mukul is found, category Other to Shopping"
          seen 'matching [^ ]*mukul[^ ]* in Finance' ai_recat_7 "Mukul: searched for mukul only (the word category is not part of the name)"
          tap_text Change c4; sleep 15
          shot demo_ai_recat_8_mukul_changed; screen_text ai_recat_8
          seen 'Done: ' ai_recat_8 "Mukul: changed after confirming, read back from the database"
          tap_text Undo u2; sleep 15; screen_text ai_recat_9
          seen 'is back in Other' ai_recat_9 "Mukul: Undo confirmed"
          adb shell am force-stop $PKG

          # ---- Due Summary: tap the header to fold and open it ----
          tap_desc() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml "shots/$2.xml" >/dev/null 2>&1
            B=$(grep -o "content-desc=\"$1[^\"]*\"[^>]*bounds=\"\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]\"" "shots/$2.xml" | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
            [ -z "$B" ] && { echo "NOT FOUND ON SCREEN: $1"; return 1; }
            set -- "$1" "$2" $(echo "$B" | sed 's/\]\[/ /; s/[][]//g; s/,/ /g')
            adb shell input tap $(( ($3 + $5) / 2 )) $(( ($4 + $6) / 2 )); echo "TAPPED: $1"
          }
          adb shell am start -W -n $PKG/.DemoActivity --es route home >/dev/null 2>&1; sleep 8
          tap_desc "Due summary" due1; sleep 3; shot demo_due_tapped_fold; screen_text due2
          grep -q 'content-desc="Due summary, folded' shots/due2.xml && echo "CHECK Due Summary folds on tap: PASS" || echo "CHECK Due Summary folds on tap: FAIL"
          tap_desc "Due summary" due3; sleep 3; shot demo_due_tapped_open; screen_text due4
          grep -q 'content-desc="Due summary, open' shots/due4.xml && echo "CHECK Due Summary opens again on tap: PASS" || echo "CHECK Due Summary opens again on tap: FAIL"
          adb shell am force-stop $PKG

          # ---- AI screen (connected layout) at different text sizes and widths ----
          demo universal_connected "" 6 no
          demo dark:universal_connected "" 6 no
          adb shell settings put system font_scale 1.3
          demo universal_connected "" 6 no; mv shots/demo_universal_connected-full.png shots/demo_universal_connected_font130-full.png
          adb shell settings put system font_scale 1.0
          adb shell wm size 720x1520; adb shell wm density 320
          demo universal_connected "" 6 no; mv shots/demo_universal_connected-full.png shots/demo_universal_connected_narrow-full.png
          # demo() closes the app after its screenshot, so open the screen again to read its text.
          adb shell am start -W -n $PKG/.DemoActivity --es route universal_connected >/dev/null 2>&1; sleep 6
          screen_text chips_narrow; adb shell am force-stop $PKG
          grep -q 'text="Google"' shots/chips_narrow.xml && echo "CHECK Google chip on one line at 360dp: PASS" || echo "CHECK Google chip on one line at 360dp: FAIL"
          adb shell wm size reset; adb shell wm density reset
          demo universal_connected "" 6 no

          # ---- Health, Documents and Reminders add forms, light and dark ----
          for r in form:vitals form:medicines form:documents form:reminders dark:form:vitals dark:form:medicines dark:form:documents dark:form:reminders; do demo "$r" "" 7 no; done

          # ---- Phase 1: family activity, document expiry, recurring payments (light and dark) ----
          for r in activity recurring documents dark:activity dark:recurring dark:documents; do demo "$r" "" 7 no; done
          demo form:documents "" 7 scroll
          # ---- Phase 2: shopping lists, calendar 2.0, subscriptions, maintenance and vehicles (light and dark) ----
          for r in shopping calendar subscriptions maintenance vehicles dark:shopping dark:calendar dark:subscriptions dark:maintenance; do demo "$r" "" 7 no; done
          adb shell am start -W -n $PKG/.DemoActivity --es route calendar >/dev/null 2>&1; sleep 7; screen_text p2cal
          seen '1 clash' p2cal "calendar: the dentist and PTM clash is flagged"
          tap_text Agenda p2a; sleep 2; shot demo_calendar_agenda; screen_text p2cal2
          seen 'School PTM' p2cal2 "calendar: agenda view lists the next 30 days"
          adb shell am force-stop $PKG
          adb shell am start -W -n $PKG/.DemoActivity --es route shopping >/dev/null 2>&1; sleep 7; screen_text p2shop
          seen 'to buy' p2shop "shopping: pending count and estimate shown"
          seen 'Not in shop' p2shop "shopping: an item can be marked not available"
          adb shell am force-stop $PKG
          adb shell am start -W -n $PKG/.DemoActivity --es route subscriptions >/dev/null 2>&1; sleep 7; screen_text p2sub
          seen 'Per month' p2sub "subscriptions: monthly and yearly totals shown"
          seen 'paused' p2sub "subscriptions: paused one counted separately"
          seen 'Paid recently' p2sub "subscriptions: payments found in Finance are listed"
          adb shell am force-stop $PKG
          adb shell am start -W -n $PKG/.DemoActivity --es route alerts >/dev/null 2>&1; sleep 7; shot demo_alerts_centre; screen_text alc
          seen 'text="All (' alc "notification centre: filter chips with counts"
          adb shell am force-stop $PKG
          adb shell am start -W -n $PKG/.DemoActivity --es route maintenance >/dev/null 2>&1; sleep 7; screen_text p2m
          seen 'Log service' p2m "maintenance: service history and Log service shown"
          adb shell am force-stop $PKG

          # ---- Phase 3: savings goals, budget planner, money insights, reports (light and dark) ----
          for r in goals budget_planner money_intel reports dark:goals dark:budget_planner dark:money_intel dark:reports; do demo "$r" "" 7 no; done
          adb shell am start -W -n $PKG/.DemoActivity --es route budget_planner >/dev/null 2>&1; sleep 7; screen_text p3b
          seen 'Category limits' p3b "budget: planned against actual by category"
          seen 'only me' p3b "budget: an Only me limit is shown as such"
          adb shell am force-stop $PKG
          adb shell am start -W -n $PKG/.DemoActivity --es route money_intel >/dev/null 2>&1; sleep 7
          for n in 1 2 3; do adb shell input swipe $((SW / 2)) $((SH * 8 / 10)) $((SW / 2)) $((SH * 2 / 10)) 400; sleep 1; done; screen_text p3i
          seen 'not financial advice' p3i "insights: suggestions are labelled as suggestions, not advice"
          adb shell am force-stop $PKG
          adb shell am start -W -n $PKG/.DemoActivity --es route goals >/dev/null 2>&1; sleep 7; screen_text p3g
          seen 'Goal progress' p3g "goals: progress, remaining and who added money"
          adb shell am force-stop $PKG
          adb shell am start -W -n $PKG/.DemoActivity --es route reports >/dev/null 2>&1; sleep 6
          tap_text Share p3r; sleep 4; shot demo_reports_share; screen_text p3r2
          grep -qiE 'Sharing 1 file|monthly-expenses' shots/p3r2.xml && echo "CHECK reports: a CSV opens the share sheet: PASS" || echo "CHECK reports: a CSV opens the share sheet: FAIL"
          # The share sheet belongs to Android: close it so it does not cover the next screens.
          adb shell input keyevent KEYCODE_BACK; sleep 1; adb shell input keyevent KEYCODE_BACK; sleep 1; adb shell input keyevent KEYCODE_HOME; sleep 1
          adb shell am force-stop $PKG

          # ---- Phase 4: the family planner in the assistant (answered on the phone) and the weekly brief ----
          askq() { adb shell cmd statusbar collapse >/dev/null 2>&1; adb shell am start -W -n $PKG/.DemoActivity --es route ask --es ask "$1" >/dev/null 2>&1; sleep 8; shot "demo_ask_$2"; screen_text "ask_$2"; adb shell am force-stop $PKG; }
          # ---- Universal search and Liquid Glass (27 Nov 22:38) ----
          srch() { adb shell cmd statusbar collapse >/dev/null 2>&1; adb shell am start -W -n $PKG/.DemoActivity --es route "$1" --es ask "$2" >/dev/null 2>&1; sleep 8; shot "demo_$3"; screen_text "$3"; adb shell am force-stop $PKG; }
          srch home none home_search; seen 'Search FamilyHub' home_search "home: the search bar is on Home"
          srch search none search_empty; seen 'Search all of FamilyHub' search_empty "search: the empty page says what it searches"
          srch search_q Netflix search_netflix; seen 'All (' search_netflix "search: results with an All filter and counts"
          seen 'Subscriptions (' search_netflix "search: results from Subscriptions"
          seen 'Finance (' search_netflix "search: results from Finance payments"
          srch search_q 649 search_amount; seen 'Netflix' search_amount "search: found by amount"
          srch search_q zorbing search_none; seen 'No results' search_none "search: nothing found is said plainly"
          srch dark:search_q Netflix search_dark; seen 'All (' search_dark "search: dark theme"
          srch dark:home none home_dark_glass; seen 'Search FamilyHub' home_dark_glass "home: dark theme with search"
          # ---- Chat: photos, voice messages, files, typing (28 Nov) ----
          srch "chat:dm_asha_demo-user" none chat_dm
          if ! grep -q 'Asha is typing' shots/chat_dm.xml; then
            echo "typing line not in the first screen read; lines mentioning typing:"; grep -o '[a-z-]*="[^"]*yping[^"]*"' shots/chat_dm.xml || echo "(none)"
            adb shell am start -W -n $PKG/.DemoActivity --es route "chat:dm_asha_demo-user" >/dev/null 2>&1; sleep 5; screen_text chat_dm_typing; adb shell am force-stop $PKG
            cp shots/chat_dm_typing.xml shots/chat_dm_t.xml
          else cp shots/chat_dm.xml shots/chat_dm_t.xml; fi
          seen 'Asha is typing' chat_dm_t "chat: typing indicator shows who is typing"
          seen 'content-desc="Photo"' chat_dm "chat: a photo shows in the chat"
          seen 'Play voice message' chat_dm "chat: a voice message has a play button"
          seen '0:07' chat_dm "chat: voice message length shown"
          seen 'Record a voice message' chat_dm "chat: mic button when nothing is typed"
          srch "dark:chat:dm_asha_demo-user" none chat_dm_dark; seen 'Play voice message' chat_dm_dark "chat: voice message in dark theme"
          adb shell am start -W -n $PKG/.DemoActivity --es route "chat:family" >/dev/null 2>&1; sleep 8; shot demo_chat_family_file; screen_text chat_file
          seen 'Car insurance 2026.pdf' chat_file "chat: a file shows its name"
          seen '1.2 MB' chat_file "chat: a file shows its size"
          tap_desc "Attach a photo, file or poll" chat_att; sleep 3; shot demo_chat_attach_sheet; screen_text chat_att2
          seen 'Document or file' chat_att2 "chat: attach sheet offers photo, file and poll"
          adb shell input keyevent KEYCODE_BACK; sleep 2
          tap_desc "Photos, voice messages and files" chat_gal; sleep 3; shot demo_chat_gallery; screen_text chat_gal2
          seen 'Show when I' chat_gal2 "chat: shared media with the typing privacy switch"
          adb shell am force-stop $PKG
          # ---- Group calls (screens only; real calls need two phones) and the Calls screen ----
          srch group_ringing none grp_ring; seen 'started a group call' grp_ring "group call: incoming invitation names who started it"
          seen 'Join' grp_ring "group call: Join and Decline buttons"
          grep -q 'with you, Demo User' shots/grp_ring.xml && echo "CHECK group call: invitation does not list me twice: FAIL" || echo "CHECK group call: invitation does not list me twice: PASS"
          srch group_call none grp_call; seen '3 in the call' grp_call "group call: how many are in the call"
          seen 'Ringing…' grp_call "group call: someone not yet answered shows Ringing"
          seen 'Reconnecting…' grp_call "group call: a dropped connection shows Reconnecting"
          seen 'Fair connection' grp_call "group call: network quality shown"
          srch calls none calls_grp; seen 'Start a group call' calls_grp "calls: start a group call button"
          # ---- Savings challenges and the widget privacy setting ----
          srch challenges none chal; seen 'Challenge progress' chal "challenges: progress card"
          seen 'behind plan' chal "challenges: 52-week shows how far behind plan"
          seen 'days with no spending' chal "challenges: no-spend days worked out from Finance"
          seen 'I saved' chal "challenges: one tap to record this week's saving"
          srch dark:challenges none chal_dark; seen 'Challenge progress' chal_dark "challenges: dark theme"
          # ---- Per-member section access (28 Nov) ----
          srch access_sheet none acc_sheet; seen 'Access for Ravi' acc_sheet "access: admin sheet for one member"
          seen 'View only' acc_sheet "access: None / View only / Full choices"
          seen 'enforce this' acc_sheet "access: sheet says the rules enforce it"
          srch limited:medicines none acc_none; seen 'No access' acc_none "access: a None section shows No access"
          srch limited:subscriptions none acc_view; seen 'view-only access to Finance' acc_view "access: view-only Finance says so"
          srch limited:subscriptions none acc_view2; notseen 'content-desc="Add"' acc_view2 "access: view-only hides the Add button"
          srch "limited:chat:dm_asha_demo-user" none acc_chat; seen 'not allowed you to send' acc_chat "access: view-only chat cannot send"
          srch subscriptions none acc_full; seen 'content-desc="Add"' acc_full "access: full access keeps the Add button"
          # ---- Update checker (28 Nov) ----
          srch update_available none upd_new; seen 'Update available: FamilyHub 2.1.999' upd_new "updates: newer release shown with its version"
          seen 's new' upd_new "updates: release notes shown"
          seen 'Download update' upd_new "updates: Download update button (person starts it)"
          seen 'same key as this app' upd_new "updates: says Android checks the signature"
          srch update_current none upd_cur; seen 'up to date' upd_cur "updates: up to date when no newer build"
          # ---- Travel planner and expense splitting (28 Nov) ----
          srch settle none split_all; seen 'Shared spending' split_all "split: shared spending summary"
          seen 'Record payment' split_all "split: fewest payments with Record payment"
          seen 'Jaipur' split_all "split: filter by trip"
          seen 'gets back' split_all "split: who gets money back"
          srch form:settle none split_form; seen 'How to split' split_form "split: form has How to split"
          srch travel none trip_head; seen 'Starts in 2' trip_head "travel: countdown to the next trip"
          seen '2 of 4' trip_head "travel: packing progress"
          seen 'Going: Asha, Ravi' trip_head "travel: who is going"
          # ---- Memories: photos, reactions, comments (28 Nov) ----
          srch memories none mem_list; seen 'On this day' mem_list "memories: on this day from earlier years"
          seen 'Goa trips (1)' mem_list "memories: albums with counts"
          srch "memory:mem-goa" none mem_detail; seen 'Photos (2)' mem_detail "memories: photo album on a memory"
          seen 'Add photos' mem_detail "memories: add photos button"
          seen 'Best trip ever' mem_detail "memories: comments shown"
          seen 'Add a comment' mem_detail "memories: comment box"
          seen 'content-desc="Photo"' mem_detail "memories: photos load (free plan storage)"
          srch "limited:memory:mem-goa" none mem_ro; seen 'Photos (2)' mem_ro "memories: still visible with limited access"
          # ---- Offline and sync (28 Nov) ----
          srch sync_offline none sync_off; seen '2 changes will sync' sync_off "sync: offline notice with waiting changes"
          srch sync_saved none sync_ok; seen 'All changes saved' sync_ok "sync: all changes saved"
          # ---- Bank SMS by share or paste (no SMS-reading permission) ----
          srch import none imp_screen; seen 'Paste SMS' imp_screen "import: paste bank SMS button"
          seen 'cannot read your SMS inbox' imp_screen "import: says the app cannot read the SMS inbox"
          srch import_shared none imp_shared; seen 'new transaction' imp_shared "import: shared SMS text finds transactions"
          adb shell am start -W -n $PKG/.DemoActivity --es route settings >/dev/null 2>&1; sleep 8
          # Scroll down in small steps until the widgets section is on screen (Settings grows as sections are added).
          : > shots/set_w2.xml
          for i in 1 2 3 4 5 6 7 8; do
            adb shell input swipe $((SW / 2)) $((SH * 7 / 10)) $((SW / 2)) $((SH * 4 / 10)) 400; sleep 1
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml shots/set_w2.xml >/dev/null 2>&1
            grep -q 'Private widgets' shots/set_w2.xml && break
          done
          shot demo_settings_widgets; adb shell am force-stop $PKG
          seen 'Private widgets' set_w2 "settings: private widgets switch"
          askq "Show_our_upcoming_bills" bills; seen 'Due in the next 30 days' ask_bills "planner: upcoming bills with the total"
          askq "What_do_we_have_scheduled_this_week?" week; seen 'Planned for this week' ask_week "planner: this week's schedule"
          seen 'Clash' ask_week "planner: the clash is pointed out"
          askq "Suggest_reminders" rem; seen 'have no reminder yet' ask_rem "planner: reminders to set, each to confirm"
          askq "Create_a_shopping_list_for_tomorrow:_milk,_eggs_and_bread" shop; seen 'Tomorrow' ask_shop "planner: a named shopping list from one sentence"
          askq "Which_category_increased_compared_to_last_month?" cat; seen 'last month' ask_cat "planner: category increase from real data"
          askq "Weekly_family_brief" brief; seen 'Your weekly family brief' ask_brief "planner: weekly brief in the chat"
          askq "How_much_did_we_spend_on_grocery_this_month?" groc; seen 'on Groceries this month' ask_groc "spend: 'grocery' (singular) finds Groceries"
          seen 'from your own Only me entries' ask_groc "spend: a 'we' question includes my own Only me grocery entry"
          seen 'Last month:' ask_groc "spend: previous month shown"
          askq "How_much_i_spend_on_transport_this_month?" trans; seen 'on Transport this month' ask_trans "spend: Transport still works"
          askq "grocery_pe_kitna_kharcha_hua_is_mahine" hing; seen 'on Groceries this month' ask_hing "spend: Hinglish question"
          askq "How_much_did_we_spend_on_food_shopping_this_month?" food; seen 'on Groceries this month' ask_food "spend: 'food shopping' means Groceries"
          askq "How_much_did_I_spend_on_kitchen_supplies_this_month?" sub; seen 'Household › Kitchen supplies' ask_sub "spend: a subcategory is found"
          askq "How_much_did_we_spend_on_cab_this_month?" amb; seen 'matches more than one category' ask_amb "spend: two real matches → asks which one"
          askq "How_much_did_we_spend_on_zorbing_this_month?" none; seen 'find a category or payee' ask_none "spend: no match said honestly"
          # P0 (27 Nov 20:33): no Gemini key on this emulator. Money questions must be answered on the phone; others ask for a key.
          askq "Write_a_short_poem_about_rain" gen; seen 'add your own free Gemini API key' ask_gen "no key: a general question asks for a Gemini key (proves no key is set)"
          askq "How_much_did_we_apend_on_grocery_this_month" apend; seen 'on Groceries this month' ask_apend "no key: typo 'apend' still answered from Finance"
          grep -q 'Gemini API key' shots/ask_apend.xml && echo "CHECK no key: money question never asks for a key: FAIL" || echo "CHECK no key: money question never asks for a key: PASS"
          askq "How_much_did_I_spend_on_transport_this_month?" trans2; seen 'on Transport this month' ask_trans2 "no key: 'I' transport question"
          askq "grocery_pe_kitna_kharcha_hua_is_mahine?" hing2; seen 'on Groceries this month' ask_hing2 "no key: Hinglish with a question mark"
          askq "What_is_our_grocery_spending_this_month?" our; seen 'on Groceries this month' ask_our "no key: 'our' question"
          askq "How_much_did_we_spend_on_grocery_this_week?" wk; seen 'on Groceries this week' ask_wk "no key: weekly question"
          seen 'Last week:' ask_wk "no key: weekly question compares with last week"
          askq "How_much_did_we_spend_on_grocery_last_month?" lm; seen 'on Groceries last month' ask_lm "no key: previous-month question"
          grep -q 'The family spent .* this month\. Card bill' shots/ask_groc.xml && echo "CHECK spend: never the overall total for a category: FAIL" || echo "CHECK spend: never the overall total for a category: PASS"
          for r in weekly_brief dark:weekly_brief; do demo "$r" "" 7 no; done

          # Track a recurring payment: confirm dialog, saved to the test database, suggestion gone.
          adb shell cmd statusbar collapse >/dev/null 2>&1
          adb shell am start -W -n $PKG/.DemoActivity --es route recurring --es store emulator >/dev/null 2>&1; sleep 10
          tap_text Track r1; sleep 3; shot demo_recurring_confirm; screen_text rec1
          seen 'Track this payment' rec1 "recurring: Track asks to confirm name, amount and frequency first"
          tap_text Save r2; sleep 8; shot demo_recurring_saved; screen_text rec2
          seen 'No new recurring payments found' rec2 "recurring: saved after confirming, suggestion no longer offered"
          adb shell am force-stop $PKG
          adb shell am start -n $PKG/.MainActivity >/dev/null 2>&1
          sleep 5
          adb logcat -d > shots/logcat.txt
          echo "---- App log lines:"
          grep -iE "familyhub|FamilyRepository|RecordRepository|credential|GoogleId" shots/logcat.txt | tail -60
          if grep -q "FATAL EXCEPTION" shots/logcat.txt; then
            echo "RESULT: APP CRASHED"
            grep -A 40 "FATAL EXCEPTION" shots/logcat.txt | head -80
            exit 1
          fi
          if [ -z "$(adb shell pidof $PKG)" ]; then
            echo "RESULT: APP IS NOT RUNNING"
            exit 1
          fi
          echo "RESULT: NO CRASH"
          SCRIPT
          chmod +x smoke.sh

      - name: Start a local Firestore emulator (test database for the AI category check, no real data)
        run: |
          mkdir -p fsemu && cd fsemu
          echo '{"emulators":{"firestore":{"host":"0.0.0.0","port":8080}}}' > firebase.json
          npm install -g firebase-tools@13.29.1 >/dev/null 2>&1
          java -version 2>&1 | head -1
          nohup firebase emulators:start --only firestore --project demo-familyhub > ../fsemu.log 2>&1 &
          for i in $(seq 1 60); do curl -s localhost:8080 >/dev/null && break; sleep 2; done
          curl -s localhost:8080 >/dev/null && echo "Firestore emulator is up" || (echo "Firestore emulator did not start"; tail -30 ../fsemu.log)

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./smoke.sh

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: shots

      - name: Publish demo screenshots to the demo-screenshots branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p pub
          for f in shots/*-full.png; do
            [ -e "$f" ] || continue
            n=$(basename "$f" -full.png)
            convert "$f" -resize 720x -quality 85 "pub/$n.jpg" || cp "$f" "pub/$n.png"
          done
          ls pub | head -80
          cd pub
          git init -q -b demo-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Demo screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-screenshots

  # Android 9 (API 28), the newest Android a Samsung Galaxy Note 8 gets, to check the app installs and its main
  # screens open on an older system. An emulator, not the real phone (that stays on the phone checklist).
  android9-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: family-hub-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write test script
        run: |
          mkdir -p a9
          cat > a9.sh <<'SCRIPT'
          #!/bin/bash
          PKG=com.familyhub.app
          echo "Android version: $(adb shell getprop ro.build.version.release) (API $(adb shell getprop ro.build.version.sdk))"
          adb install -r apk/app-debug.apk && echo "CHECK Android 9: installs: PASS" || echo "CHECK Android 9: installs: FAIL"
          adb logcat -c
          dump() { adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml "a9/$1.xml" >/dev/null 2>&1; adb shell screencap -p /sdcard/s.png; adb pull /sdcard/s.png "a9/$1.png" >/dev/null 2>&1; }
          seen() { grep -q "$1" "a9/$2.xml" && echo "CHECK Android 9: $3: PASS" || echo "CHECK Android 9: $3: FAIL"; }
          adb shell am start -W -n $PKG/.MainActivity >/dev/null 2>&1; sleep 12; dump launch
          seen 'Continue with Google' launch "sign-in screen opens"
          for r in home finance chat_list memories travel settle import settings update_available sync_offline; do
            adb shell am start -W -n $PKG/.DemoActivity --es route "$r" >/dev/null 2>&1; sleep 7; dump "r_$r"; adb shell am force-stop $PKG
          done
          seen 'Search FamilyHub' r_home "home"
          seen 'Shared spending' r_settle "settle up"
          seen 'Paste SMS' r_import "import: paste bank SMS"
          seen 'Download update' r_update_available "update checker"
          seen 'changes will sync' r_sync_offline "offline notice"
          if adb logcat -d | grep -q "FATAL EXCEPTION"; then echo "RESULT: APP CRASHED ON ANDROID 9"; adb logcat -d | grep -A 30 "FATAL EXCEPTION" | head -60; exit 1; fi
          echo "RESULT: NO CRASH ON ANDROID 9"
          SCRIPT
          chmod +x a9.sh
      - name: Run on Android 9 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./a9.sh
      - name: Upload Android 9 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android9-results
          path: a9

  # After the emulator run finds no crash, publish the APK as a GitHub Release ("build-<number>").
  # The app's update checker reads the latest release; the person downloads and installs it themselves.
  # The APK is signed with the fixed CI key, so Android accepts it only as an update of the same app.
  publish-release:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: family-hub-apk
          path: apk
      - name: Download emulator check results
        uses: actions/download-artifact@v4
        with:
          name: smoke-test-results
          path: smoke
      # Publish only when the screen checks really ran and almost all passed (a few known check-only failures).
      - name: Check the emulator results
        run: |
          pass=$(grep -c ': PASS' smoke/checks.txt || true); fail=$(grep -c ': FAIL' smoke/checks.txt || true)
          echo "Emulator checks: $pass passed, $fail failed"
          grep ': FAIL' smoke/checks.txt || true
          [ "$pass" -ge 90 ] && [ "$fail" -le 5 ] || { echo "RESULT: not publishing (too few checks passed)"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          set -e
          cp apk/app-debug.apk "FamilyHub-2.1.$N.apk"
          {
            echo "FamilyHub 2.1.$N (build $N), commit ${GITHUB_SHA::7}."
            echo
            echo "Changes:"
            git log -8 --format='- %s' | grep -v -E '^- (Add files via upload|Apply code bundle)$' | head -6
            echo
            echo "Install: download the APK on your phone and open it. Android installs it only over the same signed app."
            echo "Checks: emulator run passed with no crash (Build APK run ${GITHUB_RUN_ID})."
          } > notes.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "build-$N" "$GITHUB_SHA"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/build-$N"
          gh release create "build-$N" "FamilyHub-2.1.$N.apk" --repo "$GITHUB_REPOSITORY" \
            --title "FamilyHub 2.1.$N" --notes-file notes.txt --verify-tag --latest
          echo "RESULT: published build-$N"
