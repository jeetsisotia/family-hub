name: Build APK


on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      - name: Restore Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          cp ~/.android/debug.keystore "$RUNNER_TEMP/debug-ci.keystore"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug-ci.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore ~/.android/debug.keystore -storepass android


      - name: Build Debug APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle assembleDebug --no-daemon --stacktrace


      - name: Verify signing key and Web client ID
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          EXPECTED_SHA1="a07fc102a4b6c6258b7336cf5365ff4bdb82140d"
          EXPECTED_WEB="1070062203046-pfg9qe1rj4nd3u35od3vvqbb3f7cp3lp.apps.googleusercontent.com"
          APK_SHA1=$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "SHA-1" | head -1 | awk '{print $NF}')
          echo "APK signed with SHA-1: $APK_SHA1"
          echo "Firebase has SHA-1:    $EXPECTED_SHA1"
          [ "$APK_SHA1" = "$EXPECTED_SHA1" ] && echo "SHA-1 MATCH" || echo "SHA-1 MISMATCH -> register the APK SHA-1 in Firebase"
          [ "$(echo -n "$GOOGLE_WEB_CLIENT_ID" | tr -d '[:space:]')" = "$EXPECTED_WEB" ] && echo "WEB CLIENT ID MATCH" || echo "WEB CLIENT ID MISMATCH or EMPTY -> fix the GOOGLE_WEB_CLIENT_ID secret"


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-hub-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Installs the new APK on an Android emulator, opens it, taps "Continue with Google"
  # and fails if the app crashes. The log shows what was on screen.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: family-hub-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick >/dev/null 2>&1 || true

      - name: Write test script
        run: |
          mkdir -p shots
          cat > smoke.sh <<'SCRIPT'
          #!/bin/bash
          PKG=com.familyhub.app
          screen_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            adb pull /sdcard/ui.xml "shots/$1.xml" >/dev/null 2>&1
            echo "---- On screen ($1):"
            grep -o 'text="[^"]\+"' "shots/$1.xml" | sort -u | head -40
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png "shots/$1.png" >/dev/null 2>&1
          }
          shot() {
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png "shots/$1-full.png" >/dev/null 2>&1
            convert "shots/$1-full.png" -resize 432x -quality 70 "shots/$1.jpg" 2>/dev/null && echo "SHOT_$1:$(base64 -w0 "shots/$1.jpg")"
          }
          adb install -r apk/app-debug.apk
          adb logcat -c
          adb shell am start -W -n $PKG/.MainActivity
          sleep 1
          shot intro
          sleep 6
          shot login
          sleep 12
          screen_text 1-launch
          B=$(grep -o 'text="Continue with Google"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' shots/1-launch.xml | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
          if [ -n "$B" ]; then
            set -- $(echo "$B" | sed 's/\]\[/ /; s/[][]//g; s/,/ /g')
            adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
            sleep 15
            screen_text 2-after-tap
            shot after_tap
          else
            echo "Continue with Google button not found on screen"
          fi
          # Open every newer screen with sample data, photograph it and note any crash.
          read SW SH <<< "$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | tail -1 | tr x ' ')"
          demo() {
            name=$(echo "$1" | tr ':' '_')
            echo "DEMO_SCREEN: $1"
            before=$(adb logcat -d | grep -c "FATAL EXCEPTION")
            if [ -n "$2" ]; then
              adb shell am start -W -n $PKG/.DemoActivity --es route "$1" --es ask "$2" >/dev/null 2>&1
            else
              adb shell am start -W -n $PKG/.DemoActivity --es route "$1" >/dev/null 2>&1
            fi
            sleep "$3"
            shot "demo_$name"
            if [ "$4" = "scroll" ]; then
              for n in 2 3; do
                adb shell input swipe $((SW / 2)) $((SH * 8 / 10)) $((SW / 2)) $((SH * 2 / 10)) 500
                sleep 2
                shot "demo_${name}_$n"
              done
            fi
            if [ "$4" = "up" ]; then
              for n in 2 3 4 5; do
                adb shell input swipe $((SW / 2)) $((SH * 3 / 10)) $((SW / 2)) $((SH * 8 / 10)) 500
                sleep 2
                shot "demo_${name}_$n"
              done
            fi
            after=$(adb logcat -d | grep -c "FATAL EXCEPTION")
            [ "$after" != "$before" ] && echo "DEMO_CRASH: $1"
            adb shell am force-stop $PKG
          }
          # Each screenshot is named after the real screen. "dark:" opens it in the dark theme.
          for r in more settings family_tab safety sos categories duplicates chat_list calls universal ai_settings reminders health_hub alerts; do demo "$r" "" 6 no; done
          for r in home finance transactions insights cards import; do demo "$r" "" 6 scroll; done
          for r in dark:home dark:finance dark:transactions; do demo "$r" "" 6 scroll; done
          for r in dark:more dark:settings dark:categories dark:duplicates dark:safety dark:health_hub solid:home; do demo "$r" "" 6 no; done
          for r in form_expense form_edit_expense sheet_transaction dark:form_expense dark:sheet_transaction; do demo "$r" "" 7 no; done
          for r in home_scrolled dark:home_scrolled; do demo "$r" "" 8 no; done
          demo assistant "Find_duplicate_transactions" 60 up
          adb shell am start -n $PKG/.MainActivity >/dev/null 2>&1
          sleep 5
          adb logcat -d > shots/logcat.txt
          echo "---- App log lines:"
          grep -iE "familyhub|FamilyRepository|RecordRepository|credential|GoogleId" shots/logcat.txt | tail -60
          if grep -q "FATAL EXCEPTION" shots/logcat.txt; then
            echo "RESULT: APP CRASHED"
            grep -A 40 "FATAL EXCEPTION" shots/logcat.txt | head -80
            exit 1
          fi
          if [ -z "$(adb shell pidof $PKG)" ]; then
            echo "RESULT: APP IS NOT RUNNING"
            exit 1
          fi
          echo "RESULT: NO CRASH"
          SCRIPT
          chmod +x smoke.sh

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./smoke.sh

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: shots

      - name: Publish demo screenshots to the demo-screenshots branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p pub
          for f in shots/*-full.png; do
            [ -e "$f" ] || continue
            n=$(basename "$f" -full.png)
            convert "$f" -resize 720x -quality 85 "pub/$n.jpg" || cp "$f" "pub/$n.png"
          done
          ls pub | head -80
          cd pub
          git init -q -b demo-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Demo screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-screenshots
