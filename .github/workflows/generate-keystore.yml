name: Generate Fixed Debug Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Keystore and Print SHA-1 & Base64
        run: |
          keytool -genkeypair -v -keystore familyhub-debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "================ COPY SHA-1 BELOW ================"
          keytool -list -v -keystore familyhub-debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "================ COPY BASE64 BELOW ================"
          base64 -w 0 familyhub-debug.keystore
          echo ""
          echo "==================================================="
