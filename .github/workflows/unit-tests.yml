name: Unit tests

# The plain-Kotlin test suites in tools/ (money engine, imports, chat mentions, assistant questions, health,
# reminders, safety). Each prints ALL PASSED or the number of failures; any failure fails this run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Kotlin compiler
        run: |
          curl -sSL -o kc.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q kc.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Run the test suites
        run: |
          set -u
          A=$PWD/app/src/main/java/com/familyhub/app
          fails=0
          run() {
            name=$1; shift
            echo "::group::$name"
            out=$(java -jar "$@" 2>&1); echo "$out" | tail -n 60
            echo "::endgroup::"
            last=$(echo "$out" | tail -n 1)
            echo "$name: $last"
            case "$last" in "ALL PASSED"*) ;; *) fails=$((fails + 1)) ;; esac
          }
          W=$RUNNER_TEMP/w; mkdir -p $W

          (cd tools/ledger-test && cp $A/money/Ledger.kt $A/money/MerchantRules.kt $A/money/FinanceMonth.kt $A/money/Recategorize.kt $A/money/Duplicates.kt $A/money/TxnFinder.kt $W/ && \
            kotlinc $W/Ledger.kt $W/MerchantRules.kt $W/FinanceMonth.kt $W/Recategorize.kt $W/Duplicates.kt $W/TxnFinder.kt LedgerTest.kt -include-runtime -d $W/ledger.jar 2>&1 | grep -v warning || true)
          run "Money engine (ledger-test)" $W/ledger.jar

          (cd tools/import-test && \
            kotlinc $A/money/TxnParser.kt $A/money/AlertParser.kt $A/money/StatementImport.kt $A/money/StatementParser.kt $A/money/Ledger.kt TxnTest.kt -include-runtime -d $W/txn.jar 2>&1 | grep -v warning || true; \
            kotlinc $A/money/StatementParser.kt $A/money/StatementImport.kt $A/money/TxnParser.kt $A/money/AlertParser.kt $A/money/Ledger.kt StmtTest.kt -include-runtime -d $W/stmt.jar 2>&1 | grep -v warning || true)
          run "SMS and email alerts (import-test)" $W/txn.jar
          pushd tools/import-test >/dev/null; run "Statement import (import-test)" $W/stmt.jar; popd >/dev/null

          (cd tools/chat-test && kotlinc $A/ui/chat/Mentions.kt $A/data/remote/ChatMedia.kt ChatTest.kt ChatMediaTest.kt -include-runtime -d $W/chat.jar 2>&1 | grep -v warning || true)
          run "Chat mentions and attachments (chat-test)" $W/chat.jar

          (cd tools/ai-test && python3 extract.py && kotlinc Regexes.kt AiTest.kt -include-runtime -d $W/ai.jar 2>&1 | grep -v warning || true)
          run "Assistant questions (ai-test)" $W/ai.jar
          (cd tools/ai-test && kotlinc $A/core/ai/GeminiErrors.kt GeminiErrorsTest.kt -include-runtime -d $W/gerr.jar 2>&1 | grep -v warning || true)
          run "Gemini error messages (ai-test)" $W/gerr.jar
          (cd tools/phase1-test && kotlinc $A/family/Timeline.kt $A/family/DocExpiry.kt $A/money/RecurringFinder.kt $A/money/Ledger.kt Phase1Test.kt -include-runtime -d $W/phase1.jar 2>&1 | grep -v warning || true)
          run "Phase 1: timeline, document expiry, recurring payments (phase1-test)" $W/phase1.jar
          (cd tools/phase2-test && kotlinc $A/family/Phase2Logic.kt Phase2Test.kt -include-runtime -d $W/phase2.jar 2>&1 | grep -v warning || true)
          run "Phase 2: shopping lists, calendar, subscriptions, maintenance (phase2-test)" $W/phase2.jar
          (cd tools/phase3-test && kotlinc $A/money/Phase3Logic.kt $A/money/Challenges.kt $A/money/Ledger.kt $A/money/RecurringFinder.kt Phase3Test.kt -include-runtime -d $W/phase3.jar 2>&1 | grep -v warning || true)
          run "Phase 3: goals, budget plan, insights, reports (phase3-test)" $W/phase3.jar
          (cd tools/phase4-test && kotlinc $A/family/Phase4Logic.kt $A/family/DocExpiry.kt $A/family/Phase2Logic.kt Phase4Test.kt -include-runtime -d $W/phase4.jar 2>&1 | grep -v warning || true)
          run "Phase 4: planner, reminder suggestions, shopping lists (phase4-test)" $W/phase4.jar
          (cd tools/search-test && kotlinc $A/core/search/SearchIndex.kt SearchTest.kt -include-runtime -d $W/search.jar 2>&1 | grep -v warning || true)
          run "Universal search (search-test)" $W/search.jar
          (cd tools/call-test && kotlinc $A/calling/GroupCallMath.kt GroupCallTest.kt -include-runtime -d $W/call.jar 2>&1 | grep -v warning || true)
          run "Group calls (call-test)" $W/call.jar
          (cd tools/perms-test && kotlinc $A/family/Permissions.kt PermsTest.kt -include-runtime -d $W/perms.jar 2>&1 | grep -v warning || true)
          run "Section access (perms-test)" $W/perms.jar $PWD/firebase/firestore.rules

          (cd tools/health-test && kotlinc $A/health/HealthMath.kt $A/core/ai/AiLimiter.kt HealthTest.kt -include-runtime -d $W/health.jar 2>&1 | grep -v warning || true)
          run "Health and AI limits (health-test)" $W/health.jar

          (cd tools/reminder-test && kotlinc $A/work/ReminderRules.kt ReminderTest.kt -include-runtime -d $W/rem.jar 2>&1 | grep -v warning || true)
          run "Reminder rules (reminder-test)" $W/rem.jar

          (cd tools/safety-test && kotlinc $A/safety/SafetyLogic.kt SafetyTest.kt -include-runtime -d $W/safety.jar 2>&1 | grep -v warning || true)
          run "Safety logic (safety-test)" $W/safety.jar

          echo "Suites failed: $fails"
          [ "$fails" = "0" ]
